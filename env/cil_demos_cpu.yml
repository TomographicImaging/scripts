name: cil_demos_cpu
channels:
  - conda-forge
  - https://software.repos.intel.com/python/conda
dependencies:
  - python=3.12
  - ccpi::cil=26.0.0
  - numpy=2.4
  - astra-toolbox::astra-toolbox=2.4
  - ccpi::ccpi-regulariser 25.* py*
  - httomo::tomophantom 3.1.4
  - ipykernel
  - ipywidgets
  - scikit-image
  - matplotlib-base >=3.3.0
  - dxchange >=0.2.1
  - olefile >=0.46
  - jupyter
  - zenodo_get >=1.6
