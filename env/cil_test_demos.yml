name: cil_test_demos
channels:
  - conda-forge
  - nvidia
  - https://software.repos.intel.com/python/conda
dependencies:
  # base (vis. recipe/conda_build_config.yaml)
  - python >=3.10
  - numpy >=1.23,<3
  - libgomp # [linux]
  - ccpi::cil=26.0.0
  - ccpi::cil-data >=22
  - ccpi::tigre 3.1.3
  - ccpi::ccpi-regulariser 25.* cuda*
  - httomo::tomophantom 3.1.4
  - astra-toolbox::astra-toolbox 2.4
  - cvxpy!=1.8.2
  - python-wget
  - ipykernel 
  - scikit-image
  - packaging
  - cmake >=3.16
  - setuptools >=64
  - ipp-include 2021.12
  - ipp-devel 2021.12
  - ipp 2021.12
  - ipywidgets
  - scipy >=1.4
  - matplotlib-base >=3.3
  - h5py
  - pillow
  - dxchange >=0.2.1
  - olefile >=0.46
  - pywavelets
  - numba
  - tqdm
  - zenodo_get >=1.6
  - pytest
  - nbmake
  - tectonic
  - pip
  - pip:
    - unittest-parametrize
